#单独编译 HomeProxy(sing-box + luci-app-homeproxy)相关 ipk 包
#不生成固件镜像,不影响 QCA-ALL 等现有全量编译流程

name: HOMEPROXY-IPK

on:
  #workflow_dispatch 需要文件先存在于默认分支才能触发,当前仍在测试分支上，
  #故临时加入 push 触发以便在本分支上试跑；验证通过合并到 main 后可移除。
  push:
    branches:
      - 'ci/homeproxy-ipk'
    paths:
      - '.github/workflows/HOMEPROXY-IPK.yml'
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置(对应 Config/ 目录下的文件名)'
        default: 'CMIOT-AX18-WIFI-NO'
        required: false
        type: string
      SOURCE:
        description: '源码仓库'
        default: 'VIKINGYFY/immortalwrt'
        required: false
        type: string
      BRANCH:
        description: '源码分支'
        default: 'main'
        required: false
        type: string

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.CONFIG || 'CMIOT-AX18-WIFI-NO'}}
  WRT_REPO: https://github.com/${{inputs.SOURCE || 'VIKINGYFY/immortalwrt'}}.git
  WRT_BRANCH: ${{inputs.BRANCH || 'main'}}
  WRT_SOURCE: ${{inputs.SOURCE || 'VIKINGYFY/immortalwrt'}}

jobs:
  build:
    name: ${{inputs.CONFIG}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Caches
        id: check-cache
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify Packages in Feeds
        run: |
          cd ./wrt/

          echo "=== 确认 feeds 中包存在 ==="
          ls -d feeds/packages/net/sing-box 2>/dev/null || echo "WARN: feeds 中无 sing-box"
          ls -d feeds/luci/applications/luci-app-homeproxy 2>/dev/null || echo "WARN: feeds 中无 luci-app-homeproxy"

      - name: Custom Settings
        run: |
          cd ./wrt/

          cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=y" >> .config

          make defconfig -j$(nproc)

      - name: Download Packages
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Kernel (for kmod dependencies)
        run: |
          cd ./wrt/

          #编译 luci-app-homeproxy / sing-box 会触发 kmod 包编译(如 gpio-button-hotplug、
          #kmod-nft-tproxy),这些需要完整编译的内核树(含 .config、模块符号表)。
          #target/linux/prepare 只解压+打补丁,不生成 .config,必须完整编译内核。
          make target/linux/compile -j$(nproc) V=s || make target/linux/compile -j1 V=s

      - name: Compile HomeProxy Packages
        run: |
          cd ./wrt/

          #先编纯用户态 sing-box(不依赖内核),再编 luci-app-homeproxy(会连带 kmod)
          make package/feeds/packages/sing-box/compile -j$(nproc) V=s || make package/feeds/packages/sing-box/compile -j1 V=s
          make package/feeds/luci/luci-app-homeproxy/compile -j$(nproc) V=s || make package/feeds/luci/luci-app-homeproxy/compile -j1 V=s

      - name: Collect ipk Artifacts
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          find ./bin/packages/ -type f \( -iname '*sing-box*.ipk' -o -iname '*sing-box*.apk' \
            -o -iname '*luci-app-homeproxy*.ipk' -o -iname '*luci-app-homeproxy*.apk' \
            -o -iname '*homeproxy*.ipk' -o -iname '*homeproxy*.apk' \) \
            -exec cp -f {} ./upload/ \;

          ls -la ./upload/

      - name: Upload ipk Artifacts
        uses: actions/upload-artifact@main
        with:
          name: homeproxy-ipk-${{env.WRT_CONFIG}}-${{env.WRT_HASH}}
          path: ./wrt/upload/*.*
