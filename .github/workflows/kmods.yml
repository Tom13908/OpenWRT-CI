# One-shot: build 3 missing kmods (commit 1f96307, kernel 6.18.41) for direct apk install.
# Trigger: manual workflow_dispatch

name: KMOD-ONLY

on:
  workflow_dispatch:

permissions: write-all

jobs:
  kmods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq update
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt

      - name: Clone Pinned Source
        run: |
          cd /mnt/build_wrt
          git clone https://github.com/VIKINGYFY/immortalwrt.git
          cd immortalwrt
          git fetch --depth=1 origin 1f96307
          git checkout FETCH_HEAD
          echo "PINNED_COMMIT=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          sed -i '/.cn\//d; /tencent/d; /aliyun/d' ./scripts/projectsmirrors.json 2>/dev/null || true

      - name: Update Feeds
        run: |
          cd /mnt/build_wrt/immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write Config
        run: |
          cd /mnt/build_wrt/immortalwrt
          cat $GITHUB_WORKSPACE/Config/KMODS.txt >> .config
          make defconfig

      - name: Download Packages
        run: |
          cd /mnt/build_wrt/immortalwrt
          make download -j$(nproc)

      - name: Compile
        run: |
          cd /mnt/build_wrt/immortalwrt
          make -j$(nproc) 2>&1 | tail -60

      - name: Collect kmod apk files
        run: |
          cd /mnt/build_wrt/immortalwrt
          mkdir -p upload
          find bin/targets/ \( -name "kmod-ipt-ipset*.apk" -o -name "kmod-nft-compat*.apk" -o -name "kmod-ipt-conntrack-extra*.apk" \) -exec cp {} upload/ \;
          ls -la upload/

      - name: Release kmods
        uses: softprops/action-gh-release@master
        with:
          tag_name: KMOD-${{ env.PINNED_COMMIT }}-${{ github.run_number }}
          files: /mnt/build_wrt/immortalwrt/upload/*.apk
          body: |
            kmod-ipt-ipset / kmod-nft-compat / kmod-ipt-conntrack-extra
            Source commit: ${{ env.PINNED_COMMIT }} (same as installed firmware r0-1f96307, kernel 6.18.41)
